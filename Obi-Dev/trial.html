<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.project-pictures {
    overflow-x: hidden;
    margin: 0 20px;
    margin-bottom: 150px;
}

.project-pictures .head {
    text-align: left;
    border-bottom: 1px solid #413f3f94;
    margin: 0 0px;
    margin-bottom: 10px;
    margin-top: 200px;
}

.project-pictures .head h2 {
    font-size: 35px;
    padding-bottom: 30px;
    font-weight: 500;
    color: #FDF9CF;
}

.project-pictures .screenshots {
    display: flex;
    margin: 0 0px;
    gap: 25px;
    margin-top: 50px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
}

.project-pictures .screenshots::-webkit-scrollbar {
    display: none;
}

.project-pictures .screenshots .image {
    width: 550px;
    height: 400px;
    margin-bottom: 30px;
    flex-shrink: 0;
    scroll-snap-align: start;
}

.project-pictures .screenshots .image img {
    width: 550px;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
}

.project-pictures .prev-next {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 40px;
}

.project-pictures .prev-next button {
    border-radius: 10px;
    background-color: transparent;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    box-shadow: inset 0px 0px 20px #ffffff12, 0px 10px 30px 0px rgba(0, 0, 0, 0.2);
    cursor: pointer;
}

.project-pictures .prev-next button img {
    width: 75px;
}

.project-pictures .prev-next button:disabled {
    opacity: 0.3;
    cursor: default;
}

@media (max-width: 768px) {
    .project-pictures .screenshots .image,
    .project-pictures .screenshots .image img {
        width: 85vw;
    }
}
</style>
</head>
<body>
    <div class="project-pictures">
    <div class="head">
        <h2>More Screenshots</h2>
    </div>
    <div class="screenshots" id="projectScreenshots">
        <div class="image"><img src="img/kevin-bhagat-ms-QnzmKGVM-unsplash.jpg" alt=""></div>
        <div class="image"><img src="img/kevin-bhagat-ms-QnzmKGVM-unsplash.jpg" alt=""></div>
        <div class="image"><img src="img/kevin-bhagat-ms-QnzmKGVM-unsplash.jpg" alt=""></div>
        <div class="image"><img src="img/kevin-bhagat-ms-QnzmKGVM-unsplash.jpg" alt=""></div>
    </div>
    <div class="prev-next">
        <button id="prevBtn"><img src="img/left-arrow.png" alt=""></button>
        <button id="nextBtn"><img src="img/right-arrow.png" alt=""></button>
    </div>
</div>




</body>
</html>
